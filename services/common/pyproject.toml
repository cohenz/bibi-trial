[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ntk-common"
version = "2.1.0"
description = "Shared core of the Netanyahu trial knowledge base: contracts, pipeline, gates, search, Ask the Trial"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.22",
  "referencing>=0.35",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.19",
  "alembic>=1.13",
  "pdfplumber>=0.11",
  "pypdf>=4.2",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.10",
  "requests>=2.32",
  "boto3>=1.34",
  "redis>=5.0",
  "celery>=5.4",
]

[tool.setuptools.packages.find]
include = ["ntk_common*"]
